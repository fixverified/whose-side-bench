[project]
name = "whose-side-bench"
version = "0.1.0"
description = "Measures whether a language model's verdict in a dispute changes when only the parties' roles are swapped."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "litellm==1.99.0", "openai>=2,<3", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whose_side_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
