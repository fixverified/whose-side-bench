    for two months but omit several dates. {C} says the service remained available to both throughout those dates, and the
    emails state no rate for periods without records.'
- id: g008
  family: shared_expense
  author: gpt-6-luna
  text: '{C} says {C} paid $2,480 for materials used by both parties in a shared work area and asks {R} to pay half. {R} says
    the written agreement assigns costs by quantity used, and the receipts list purchases but not how much each party used.
    {C} says both parties used the materials over the same period, and no record identifies separate quantities.'
