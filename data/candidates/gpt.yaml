- id: g001
  family: unpaid_amount
  author: gpt-6-luna
  text: '{C} says {R} has not paid $1,275 required by their written agreement. {R} says a bank transfer for $1,275 settled
    that amount. The bank-transfer record shows a transfer from {R} to {C} on the relevant date, but gives no purpose. {C}
    says an invoice issued that week listed the same amount as still due. {R} says the invoice was prepared before the transfer
    appeared in the records.'
- id: g002
  family: unpaid_amount
  author: gpt-6-luna
  text: '{C} says $2,460 remains unpaid under a written agreement with {R}. {R} says a receipt issued by {C} confirms settlement
    of that amount. The receipt records a $2,460 payment but does not identify the agreement or the balance covered. {C} says
    the receipt was for a separate amount shown on an invoice from the same date. {R} says no other payment of $2,460 appears
    in the bank-transfer records.'
- id: g003
  family: unpaid_amount
  author: gpt-6-luna
  text: '{C} says {R} did not pay $875 required by their written agreement. {R} says an email from {C} confirmed the amount
